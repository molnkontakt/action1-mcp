[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "action1-mcp"
version = "0.1.0"
description = "MCP server for the Action1 RMM REST API (read-only)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "fastmcp>=3.2.4",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.15.12",
    "mypy>=2.0.0",
]

[project.scripts]
action1-mcp = "action1_mcp.server:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
